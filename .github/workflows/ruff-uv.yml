name: uv Ruff, Unittest

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      LANG: es_ES.UTF-8
      LC_ALL: es_ES.UTF-8
      QT_QPA_PLATFORM: offscreen
    steps:
        - uses: actions/checkout@v7
        - name: Install the latest version of uv and set the python version
          uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
          with:
            python-version: "3.14"
            version: latest
            enable-cache: true
        - name: Install project and dev dependencies
          run: uv sync --group dev
        - name: Install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              gettext \
              locales \
              libegl1 \
              libgl1 \
              libglib2.0-0 \
              libpulse0 \
              libxkbcommon-x11-0 \
              libxcb-cursor0 \
              libxcb-icccm4 \
              libxcb-image0 \
              libxcb-keysyms1 \
              libxcb-randr0 \
              libxcb-render-util0 \
              libxcb-xinerama0 \
              libxcb-xfixes0 \
              libfontconfig1 \
              libxrender1 \
              libxi6 \
              libxext6 \
              libx11-6
            sudo locale-gen es_ES.UTF-8
        - name: Compile gettext catalogs (.po → .mo)
          run: uv run python scripts/manage_translations.py compile
          env:
            LANG: es_ES.UTF-8
            LC_ALL: es_ES.UTF-8
            QT_QPA_PLATFORM: offscreen
        - name: Lint with ruff
          run: |
            # stop the build if there are Python syntax errors or undefined names
            uv run ruff check --output-format=github --select=E9,F63,F7,F82 --target-version=py314 .
            # project rules (version pinned in uv.lock via dev group)
            uv run ruff check --config=pyproject.toml --output-format=github .
        - name: Test with unittest
          run: uv run python -m unittest discover
        - name: Network and rematch integration smoke
          run: |
            uv run python -m unittest \
              tests.test_integration.TestIntegration.test_server_reassembles_fragmented_utf8_command \
              tests.test_integration.TestIntegration.test_server_handles_coalesced_frames_and_invalid_json \
              tests.test_integration.TestIntegration.test_snapshot_contract_is_complete_equal_and_resyncable \
              tests.test_integration.TestIntegration.test_disconnected_client_can_reconnect_with_same_identity \
              tests.test_integration.TestIntegration.test_rematch_isolates_state_after_disconnect_and_reconnect
        - name: Client state and Qt adapter smoke
          run: |
            uv run python -m unittest \
              tests.test_client_state_adapter \
              tests.test_protocol_features \
              tests.test_tcp_framing
        - name: Qt multiclient and reconnection smoke
          run: uv run python scripts/smoke_qt_multiclient.py --clients 3
        - name: Qt complete game and reconnection smoke
          run: uv run python scripts/smoke_qt_game.py --timeout 60
        - name: Slow client queue stress
          run: uv run python scripts/stress_slow_clients.py
        - name: Dead-code audit
          run: uv run vulture pyteg tests scripts --min-confidence 80 --sort-by-size
        - name: Ruff Formatter
          run: uv run ruff format --check .
        - name: Mypy
          run: uv run mypy
        - name: Build and smoke test wheel
          run: |
            uv build --wheel --sdist
            uv run python scripts/verify_wheel.py dist/*.whl
            uv run python scripts/verify_sdist.py dist/*.tar.gz
            uv run python scripts/smoke_wheel.py dist/*.whl
        - name: Coverage
          run: |
            uv run coverage run --branch -m unittest discover
            uv run coverage report -m
        - name: Map layout overlaps
          run: |
            uv run python scripts/check_map_overlaps.py \
              --max-bbox-pairs 75 \
              --fail-on-cross-continent \
              --allow-cross Groenlandia:Islandia,Aral:Rusia,California:Colombia,Mexico:Colombia
        - name: Visual map regression smoke
          run: uv run python scripts/smoke_visual_map.py --output-dir artifacts/map-visual
        - name: Upload visual map evidence
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: pyteg-map-visual
            path: artifacts/map-visual
            if-no-files-found: warn
        - name: Real multiclient TCP simulation
          run: |
            uv run python -m scripts.simulate_game \
              --theme classic \
              --clients 3 \
              --victory 30 \
              --seed 197 \
              --secret-objectives \
              --disconnect-client 2 \
              --disconnect-after-turn 5 \
              --reconnect-client 2 \
              --exercise-exchanges \
              --require-finalized \
              --timeout 240
        - name: Upload multiclient simulation evidence
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: pyteg-multiclient-simulation
            path: logs/simulations/classic-197
            if-no-files-found: warn
        - name: Revancha multiclient TCP simulation
          run: |
            uv run python -m scripts.simulate_game \
              --theme revancha \
              --clients 5 \
              --victory 30 \
              --seed 234 \
              --secret-objectives \
              --disconnect-client 2 \
              --disconnect-after-turn 5 \
              --reconnect-client 2 \
              --exercise-exchanges \
              --require-finalized \
              --timeout 240
        - name: Upload Revancha simulation evidence
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: pyteg-revancha-simulation
            path: logs/simulations/revancha-234
            if-no-files-found: warn
