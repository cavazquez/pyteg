name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            executable_suffix: ""
          - os: windows-latest
            platform: windows
            arch: x86_64
            executable_suffix: ".exe"
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            executable_suffix: ""
          - os: macos-15  # Apple Silicon
            platform: macos
            arch: arm64
            executable_suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          version: latest
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Compile gettext catalogs
        # Windows no trae msgfmt; los catálogos .mo ya están versionados y
        # fueron generados en el checkout de desarrollo/CI Linux.
        if: runner.os != 'Windows'
        run: uv run python scripts/manage_translations.py compile

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1 \
            libglib2.0-0 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxext6 \
            libx11-6

      - name: Mypy
        run: uv run mypy

      - name: Run tests
        run: |
          uv run python -m unittest discover
        env:
          LANG: es_ES.UTF-8
          LC_ALL: es_ES.UTF-8
          QT_QPA_PLATFORM: offscreen

      - name: Build binaries with Nuitka
        shell: bash
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF_NAME#v}"
          uv run python -c 'import platform, sys; assert platform.machine().lower() in ({"x86_64", "amd64"} if sys.argv[1] == "x86_64" else {"arm64", "aarch64"})' '${{ matrix.arch }}'
          uv run python -c 'import sys; from pyteg.version import VERSION; assert VERSION == sys.argv[1]' "$VERSION"
          uv run python scripts/build_binaries.py \
            --version "$VERSION" \
            --output-dir dist

          test -f "dist/pyteg-server-${VERSION}${{ matrix.executable_suffix }}"
          test -f "dist/pyteg-client-${VERSION}${{ matrix.executable_suffix }}"

      - name: Smoke binaries with both themes
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run python scripts/smoke_binaries.py \
            --server "dist/pyteg-server-${VERSION}${{ matrix.executable_suffix }}" \
            --client "dist/pyteg-client-${VERSION}${{ matrix.executable_suffix }}"

      - name: Create platform-specific archive
        shell: bash
        run: |
          cd dist
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF_NAME#v}"
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            7z a "pyteg-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.zip" "pyteg-server-${VERSION}${{ matrix.executable_suffix }}" "pyteg-client-${VERSION}${{ matrix.executable_suffix }}"
          else
            tar -czf "pyteg-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" "pyteg-server-${VERSION}${{ matrix.executable_suffix }}" "pyteg-client-${VERSION}${{ matrix.executable_suffix }}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pyteg-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/pyteg-*-${{ matrix.platform }}-${{ matrix.arch }}.*
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Verify release artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/verify_release_artifacts.py \
            --directory artifacts \
            --version "$VERSION"

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## PyTeg ${GITHUB_REF_NAME}

          Juego de estrategia con mapas Clásico y Revancha y reglas configurables.

          ### Novedades
          - Partidas locales de un humano contra hasta siete bots básicos.
          - Inicio común: Local, LAN o turnos por archivos, con partidas recientes.
          - Guardado automático y manual; descubrimiento de salas y migración del anfitrión.
          - Archivos de turno con vista previa, arrastrar para abrir y acceso a la carpeta exportada.
          - Historial público y repeticiones navegables.

          Para jugar localmente, abrí el cliente y elegí **Local**; no hace falta
          ejecutar el servidor por separado. Los modos LAN y por archivos están
          pensados para jugadores de confianza.

          ### Descargas disponibles
          - **Linux x86_64**: \`pyteg-${VERSION}-linux-x86_64.tar.gz\`
          - **Windows x86_64**: \`pyteg-${VERSION}-windows-x86_64.zip\`
          - **macOS x86_64**: \`pyteg-${VERSION}-macos-x86_64.tar.gz\`
          - **macOS ARM64**: \`pyteg-${VERSION}-macos-arm64.tar.gz\`

          Cada archivo contiene los ejecutables standalone del servidor y del cliente,
          junto con los mapas, iconos, sonidos y traducciones necesarios.

          ### Instrucciones
          1. Descarga el archivo correspondiente a tu plataforma.
          2. Extrae el contenido.
          3. Ejecuta \`pyteg-server-${VERSION}\` para iniciar el servidor o
             \`pyteg-client-${VERSION}\` para iniciar el cliente.

          Para más información, consulta el [README](https://github.com/cavazquez/pyteg/blob/master/README.md).
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: PyTeg ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/pyteg-*-linux-x86_64.tar.gz
            artifacts/pyteg-*-windows-x86_64.zip
            artifacts/pyteg-*-macos-x86_64.tar.gz
            artifacts/pyteg-*-macos-arm64.tar.gz
