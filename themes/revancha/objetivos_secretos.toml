# Objetivos de TEG La Revancha según el reglamento oficial.
# Incluye 19 objetivos secretos y el objetivo común de 45 países.

[Objetivos]

[Objetivos.ocupar_cuotas_globales]
id = "ocupar_cuotas_globales"
descripcion = 'Ocupar 4 países de América del Norte, 4 de Europa, 4 de Asia, 3 de América del Sur, 3 de América Central, 3 de África y 3 de Oceanía.'
tipo = "conquistar_paises"
cantidad_paises = 22
cuotas_continentes = { AmericaDelNorte = 4, Europa = 4, Asia = 4, AmericaDelSur = 3, AmericaCentral = 3, Africa = 3, Oceania = 3 }

[Objetivos.ocupar_europa_america_del_sur]
id = "ocupar_europa_america_del_sur"
descripcion = 'Ocupar Europa y América del Sur.'
tipo = "conquistar_continentes"
continentes = ["Europa", "AmericaDelSur"]

[Objetivos.ocupar_norte_oceania_africa]
id = "ocupar_norte_oceania_africa"
descripcion = 'Ocupar América del Norte, Oceanía y 5 países de África.'
tipo = "conquistar_continentes"
continentes = ["AmericaDelNorte", "Oceania"]
cuotas_continentes = { Africa = 5 }

[Objetivos.ocupar_asia_america_central]
id = "ocupar_asia_america_central"
descripcion = 'Ocupar Asia y América Central.'
tipo = "conquistar_continentes"
continentes = ["Asia", "AmericaCentral"]

[Objetivos.ocupar_norte_asia_europa]
id = "ocupar_norte_asia_europa"
descripcion = 'Ocupar América del Norte, 8 países de Asia y 4 de Europa.'
tipo = "conquistar_continentes"
continentes = ["AmericaDelNorte"]
cuotas_continentes = { Asia = 8, Europa = 4 }

[Objetivos.ocupar_oceania_asia_africa_norte]
id = "ocupar_oceania_asia_africa_norte"
descripcion = 'Ocupar Oceanía, 6 países de Asia, 6 de África y 6 de América del Norte.'
tipo = "conquistar_continentes"
continentes = ["Oceania"]
cuotas_continentes = { Asia = 6, Africa = 6, AmericaDelNorte = 6 }

[Objetivos.ocupar_central_sur_europa_asia]
id = "ocupar_central_sur_europa_asia"
descripcion = 'Ocupar América Central, 6 países de América del Sur, 6 de Europa y 6 de Asia.'
tipo = "conquistar_continentes"
continentes = ["AmericaCentral"]
cuotas_continentes = { AmericaDelSur = 6, Europa = 6, Asia = 6 }

[Objetivos.ocupar_sur_africa_asia]
id = "ocupar_sur_africa_asia"
descripcion = 'Ocupar América del Sur, África y 8 países de Asia.'
tipo = "conquistar_continentes"
continentes = ["AmericaDelSur", "Africa"]
cuotas_continentes = { Asia = 8 }

[Objetivos.ocupar_oceania_africa_central_asia]
id = "ocupar_oceania_africa_central_asia"
descripcion = 'Ocupar Oceanía, África, 4 países de América Central y 4 de Asia.'
tipo = "conquistar_continentes"
continentes = ["Oceania", "Africa"]
cuotas_continentes = { AmericaCentral = 4, Asia = 4 }

[Objetivos.ocupar_europa_asia_sur]
id = "ocupar_europa_asia_sur"
descripcion = 'Ocupar Europa, 4 países de Asia y 4 países de América del Sur.'
tipo = "conquistar_continentes"
continentes = ["Europa"]
cuotas_continentes = { Asia = 4, AmericaDelSur = 4 }

[Objetivos.ocupar_africa_europa_asia_islas]
id = "ocupar_africa_europa_asia_islas"
descripcion = 'Ocupar África, 4 países de Europa, 4 de Asia y 6 islas repartidas en por lo menos tres continentes.'
tipo = "conquistar_continentes"
continentes = ["Africa"]
cuotas_continentes = { Europa = 4, Asia = 4 }
islas = 6
continentes_minimos_islas = 3

[Objetivos.ocupar_35_paises]
id = "ocupar_35_paises"
descripcion = 'Ocupar 35 países en cualquier lugar del mapa.'
tipo = "conquistar_paises"
cantidad_paises = 35

[Objetivos.destruir_blanco]
